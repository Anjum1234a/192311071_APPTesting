name: Automated Selenium E2E Testing & Excel Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-selenium-e2e-tests:
    name: Execute 300+ Selenium E2E Test Cases & Generate Excel Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Google Chrome Browser
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip libxi6 libgconf-2-4 libnss3 google-chrome-stable

      - name: Install Python Selenium & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium pytest openpyxl webdriver-manager requests

      - name: Run Master Selenium E2E Test Suite (300+ Cases)
        run: |
          python run_e2e_suite.py

      - name: Upload Excel Test Report Artifact (.xlsx) Ready for Download
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Selenium-E2E-Test-Report-XLSX
          path: |
            E2E_Test_Report_APPTesting.xlsx
            E2E_Test_Report_APPTesting_*.xlsx
          retention-days: 90
